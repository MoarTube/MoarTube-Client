name: Linux desktop candidate

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Draft release tag'
        type: string
        required: true
        default: ''

permissions:
  contents: read

env:
  MOARTUBE_RELEASE_TAG: ${{ inputs.release_tag }}
jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - run: npm run ffmpeg:test:tooling
      - run: npm run ffmpeg:build:linux -- --arch=${{ matrix.arch }}
      - run: npm run desktop:build:linux -- --arch=${{ matrix.arch }}
      - run: npm run desktop:verify:linux -- --arch=${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: moartube-client-linux-${{ matrix.arch }}-candidate
          path: |
            build/desktop/releases/linux-${{ matrix.arch }}/*/*.deb
            build/desktop/releases/linux-${{ matrix.arch }}/*/*.tar.gz
            build/desktop/releases/linux-${{ matrix.arch }}/*/*.tar.xz
            build/desktop/releases/linux-${{ matrix.arch }}/*/SHA256SUMS-linux-${{ matrix.arch }}.txt
            build/desktop/releases/linux-${{ matrix.arch }}/*/RELEASE-NOTES-linux-${{ matrix.arch }}.md
            build/desktop/reports/linux-${{ matrix.arch }}/
          retention-days: 14

  upload-draft:
    name: Upload verified linux assets to draft
    needs: linux
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: draft-upload-${{ github.repository }}-${{ inputs.release_tag }}-linux
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - uses: actions/download-artifact@v4
        with:
          pattern: 'moartube-client-linux-*-candidate'
          path: build/release-upload
      - name: Upload linux-x64 downloads to existing draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/upload-desktop-draft.mjs linux-x64 build/release-upload
      - name: Upload linux-arm64 downloads to existing draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/upload-desktop-draft.mjs linux-arm64 build/release-upload
