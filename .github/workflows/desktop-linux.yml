name: Linux desktop candidate
on:
  push:
    branches:
      - project-refactor
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run ffmpeg:test:tooling
      - run: npm run ffmpeg:build:linux -- --arch=${{ matrix.arch }}
      - run: npm run desktop:build:linux -- --arch=${{ matrix.arch }}
      - run: npm run desktop:verify:linux -- --arch=${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: moartube-client-linux-${{ matrix.arch }}-candidate
          path: |
            build/desktop/releases/linux-${{ matrix.arch }}/*/*.deb
            build/desktop/releases/linux-${{ matrix.arch }}/*/*.tar.gz
            build/desktop/releases/linux-${{ matrix.arch }}/*/*.tar.xz
            build/desktop/releases/linux-${{ matrix.arch }}/*/SHA256SUMS-linux-${{ matrix.arch }}.txt
            build/desktop/releases/linux-${{ matrix.arch }}/*/RELEASE-NOTES-linux-${{ matrix.arch }}.md
            build/desktop/reports/linux-${{ matrix.arch }}/
          retention-days: 14
