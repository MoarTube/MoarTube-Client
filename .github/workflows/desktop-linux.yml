name: Linux desktop candidate
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Draft release tag
        type: string
        required: true
        default: ''
permissions:
  contents: read
env:
  MOARTUBE_RELEASE_TAG: ${{ inputs.release_tag }}
jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: 24.22.1
      - name: Restore verified FFmpeg downloads
        uses: actions/cache/restore@v5
        id: ffmpeg-downloads
        with:
          path: |
            build/ffmpeg/cache/sources
          key: ffmpeg-downloads-v1-${{ runner.os }}-${{ hashFiles('tooling/ffmpeg/sources.lock.json') }}
      - name: Identify compiled FFmpeg cache
        id: ffmpeg-key
        run: node tooling/ffmpeg/scripts/compiled-cache.mjs key linux-${{ matrix.arch }}
      - name: Restore compiled FFmpeg candidate
        uses: actions/cache/restore@v5
        id: compiled-ffmpeg
        with:
          path: |-
            build/ffmpeg/install/linux-${{ matrix.arch }}/bin
            build/ffmpeg/candidates/linux-${{ matrix.arch }}
            build/ffmpeg/releases/linux-${{ matrix.arch }}
            build/ffmpeg/state/linux-${{ matrix.arch }}
            build/ffmpeg/reports/linux-${{ matrix.arch }}/*.json
            build/ffmpeg/reports/linux-${{ matrix.arch }}/software/result.json
          key: ${{ steps.ffmpeg-key.outputs.key }}
      - name: Verify restored FFmpeg candidate
        if: steps.compiled-ffmpeg.outputs.cache-hit == 'true'
        run: node tooling/ffmpeg/scripts/compiled-cache.mjs verify linux-${{ matrix.arch }}
      - name: Restore desktop dependency downloads
        uses: actions/cache/restore@v5
        id: desktop-dependencies
        with:
          path: build/desktop/cache/dependencies/${{ matrix.arch }}
          key: desktop-dependencies-v1-linux-${{ matrix.arch }}-${{ hashFiles('package-lock.json', 'scripts/prefetch-desktop-tools.mjs', 'desktop/builder-cache.cjs', 'desktop/linux/dependencies.Dockerfile') }}
      - name: Download npm, Electron and packaging tools
        run: node scripts/prepare-linux-dependencies.mjs --arch=${{ matrix.arch }} --desktop --downloads-only
      - name: Save desktop dependency downloads
        if: steps.desktop-dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: build/desktop/cache/dependencies/${{ matrix.arch }}
          key: ${{ steps.desktop-dependencies.outputs.cache-primary-key }}
      - name: Download and verify all FFmpeg inputs
        if: steps.compiled-ffmpeg.outputs.cache-hit != 'true'
        run: node tooling/ffmpeg/scripts/download-inputs.mjs linux-${{ matrix.arch }}
      - name: Check complete download cache
        if: ${{ !cancelled() && steps.ffmpeg-downloads.outputs.cache-hit != 'true' }}
        id: ffmpeg-cache-ready
        run: node tooling/ffmpeg/scripts/check-download-cache.mjs linux
      - name: Save verified FFmpeg downloads
        if: ${{ !cancelled() && steps.ffmpeg-cache-ready.outputs.complete == 'true' }}
        uses: actions/cache/save@v5
        with:
          path: |
            build/ffmpeg/cache/sources
          key: ${{ steps.ffmpeg-downloads.outputs.cache-primary-key }}
      - name: Prepare all compiler and runtime containers
        run: node scripts/prepare-linux-dependencies.mjs --arch=${{ matrix.arch }} --desktop --environment-only ${{ steps.compiled-ffmpeg.outputs.cache-hit == 'true' && '--skip-compiler' || '' }}
      - run: npm run ffmpeg:test:tooling
      - run: npm run ffmpeg:build:linux -- --arch=${{ matrix.arch }}
        if: steps.compiled-ffmpeg.outputs.cache-hit != 'true'
      - name: Validate compiled candidate for caching
        id: compiled-cache-ready
        if: steps.compiled-ffmpeg.outputs.cache-hit != 'true'
        run: node tooling/ffmpeg/scripts/compiled-cache.mjs save linux-${{ matrix.arch }}
      - name: Save verified compiled FFmpeg
        if: steps.compiled-cache-ready.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: |-
            build/ffmpeg/install/linux-${{ matrix.arch }}/bin
            build/ffmpeg/candidates/linux-${{ matrix.arch }}
            build/ffmpeg/releases/linux-${{ matrix.arch }}
            build/ffmpeg/state/linux-${{ matrix.arch }}
            build/ffmpeg/reports/linux-${{ matrix.arch }}/*.json
            build/ffmpeg/reports/linux-${{ matrix.arch }}/software/result.json
          key: ${{ steps.compiled-ffmpeg.outputs.cache-primary-key }}
      - run: npm run desktop:build:linux -- --arch=${{ matrix.arch }}
      - run: npm run desktop:verify:linux -- --arch=${{ matrix.arch }}
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: moartube-client-linux-${{ matrix.arch }}-candidate
          path: |
            build/desktop/releases/linux-${{ matrix.arch }}/*/*.deb
            build/desktop/releases/linux-${{ matrix.arch }}/*/*.tar.gz
            build/desktop/releases/linux-${{ matrix.arch }}/*/*.tar.xz
            build/desktop/releases/linux-${{ matrix.arch }}/*/SHA256SUMS-linux-${{ matrix.arch }}.txt
            build/desktop/releases/linux-${{ matrix.arch }}/*/RELEASE-NOTES-linux-${{ matrix.arch }}.md
            build/desktop/reports/linux-${{ matrix.arch }}/
          retention-days: 14
    env:
      MOARTUBE_FFMPEG_OFFLINE: '1'
      MOARTUBE_DEPENDENCIES_PREPARED: '1'
  upload-draft:
    name: Upload verified linux assets to draft
    needs: linux
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: draft-upload-${{ github.repository }}-${{ inputs.release_tag }}-linux
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: 24.22.1
      - uses: actions/download-artifact@v7
        with:
          pattern: moartube-client-linux-*-candidate
          path: build/release-upload
      - name: Upload linux-x64 downloads to existing draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/upload-desktop-draft.mjs linux-x64 build/release-upload
      - name: Upload linux-arm64 downloads to existing draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/upload-desktop-draft.mjs linux-arm64 build/release-upload
