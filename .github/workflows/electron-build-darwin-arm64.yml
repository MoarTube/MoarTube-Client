name: macOS Apple Silicon ARM64 Electron candidate
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Draft release tag
        type: string
        required: true
        default: ''
permissions:
  contents: read
env:
  MOARTUBE_RELEASE_TAG: ${{ inputs.release_tag }}
jobs:
  build:
    name: Build darwin-arm64
    runs-on: macos-15
    timeout-minutes: 150
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_CACHE: ${{ github.workspace }}/build/desktop/cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/build/desktop/cache/builder
      MOARTUBE_NODE_LICENSE: ${{ github.workspace }}/build/desktop/node-LICENSE
      MOARTUBE_FFMPEG_OFFLINE: '1'
      MOARTUBE_DEPENDENCIES_PREPARED: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: 24.22.1
          architecture: arm64
      - name: Restore verified FFmpeg downloads
        uses: actions/cache/restore@v5
        id: ffmpeg-downloads
        with:
          path: |
            build/ffmpeg/cache/sources
          key: ffmpeg-downloads-v1-${{ runner.os }}-${{ hashFiles('tooling/ffmpeg/sources.lock.json') }}
      - name: Identify compiled FFmpeg cache
        id: ffmpeg-key
        run: node tooling/ffmpeg/scripts/compiled-cache.mjs key darwin-arm64
      - name: Restore compiled FFmpeg candidate
        uses: actions/cache/restore@v5
        id: compiled-ffmpeg
        with:
          path: |-
            build/ffmpeg/install/darwin-arm64/bin
            build/ffmpeg/candidates/darwin-arm64
            build/ffmpeg/releases/darwin-arm64
            build/ffmpeg/state/darwin-arm64
            build/ffmpeg/reports/darwin-arm64/*.json
            build/ffmpeg/reports/darwin-arm64/software/result.json
          key: ${{ steps.ffmpeg-key.outputs.key }}
      - name: Verify restored FFmpeg candidate
        if: steps.compiled-ffmpeg.outputs.cache-hit == 'true'
        run: node tooling/ffmpeg/scripts/compiled-cache.mjs verify darwin-arm64
      - name: Restore desktop dependency downloads
        uses: actions/cache/restore@v5
        id: desktop-dependencies
        with:
          path: |-
            build/desktop/cache/electron
            build/desktop/cache/builder
          key: desktop-dependencies-v1-darwin-arm64-${{ hashFiles('package-lock.json', 'scripts/prefetch-desktop-tools.mjs', 'desktop/builder-cache.cjs', 'desktop/linux/dependencies.Dockerfile') }}
          restore-keys: desktop-dependencies-v1-darwin-
      - name: Locate npm download cache
        id: npm-cache-directory
        run: node scripts/npm-cache-directory.mjs
      - name: Restore npm downloads
        id: npm-downloads
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.npm-cache-directory.outputs.directory }}
          key: npm-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-downloads-v1-${{ runner.os }}-
      - run: npm ci
      - name: Save completed npm downloads
        if: steps.npm-downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.npm-cache-directory.outputs.directory }}
          key: ${{ steps.npm-downloads.outputs.cache-primary-key }}
      - name: Preserve the matching bundled Node license
        run: |
          mkdir -p build/desktop
          curl --fail --location --retry 3 "https://raw.githubusercontent.com/nodejs/node/$(node -p process.version)/LICENSE" --output "$MOARTUBE_NODE_LICENSE"
      - name: Download Electron and packaging tools
        run: node scripts/prefetch-desktop-tools.mjs
      - name: Save desktop dependency downloads
        if: steps.desktop-dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |-
            build/desktop/cache/electron
            build/desktop/cache/builder
          key: ${{ steps.desktop-dependencies.outputs.cache-primary-key }}
      - name: Download and verify all FFmpeg inputs
        if: steps.compiled-ffmpeg.outputs.cache-hit != 'true'
        run: node tooling/ffmpeg/scripts/download-inputs.mjs darwin-arm64
      - name: Check complete download cache
        if: ${{ !cancelled() && steps.ffmpeg-downloads.outputs.cache-hit != 'true' }}
        id: ffmpeg-cache-ready
        run: node tooling/ffmpeg/scripts/check-download-cache.mjs darwin
      - name: Save verified FFmpeg downloads
        if: ${{ !cancelled() && steps.ffmpeg-cache-ready.outputs.complete == 'true' }}
        uses: actions/cache/save@v5
        with:
          path: |
            build/ffmpeg/cache/sources
          key: ${{ steps.ffmpeg-downloads.outputs.cache-primary-key }}
      - name: Install compiler tools
        run: brew install cmake ninja meson nasm pkg-config xz
        if: steps.compiled-ffmpeg.outputs.cache-hit != 'true'
      - run: npm run typecheck
      - run: npm run ffmpeg:test:tooling
      - run: npm run desktop:test
      - run: npm run ffmpeg:build:darwin:arm64
        if: steps.compiled-ffmpeg.outputs.cache-hit != 'true'
      - name: Validate compiled candidate for caching
        id: compiled-cache-ready
        if: steps.compiled-ffmpeg.outputs.cache-hit != 'true'
        run: node tooling/ffmpeg/scripts/compiled-cache.mjs save darwin-arm64
      - name: Save verified compiled FFmpeg
        if: steps.compiled-cache-ready.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: |-
            build/ffmpeg/install/darwin-arm64/bin
            build/ffmpeg/candidates/darwin-arm64
            build/ffmpeg/releases/darwin-arm64
            build/ffmpeg/state/darwin-arm64
            build/ffmpeg/reports/darwin-arm64/*.json
            build/ffmpeg/reports/darwin-arm64/software/result.json
          key: ${{ steps.compiled-ffmpeg.outputs.cache-primary-key }}
      - run: npm run desktop:build:darwin:arm64
      - uses: actions/upload-artifact@v6
        with:
          name: moartube-client-darwin-arm64-candidate
          path: build/desktop/releases/darwin-arm64/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: moartube-client-darwin-arm64-build-reports
          path: |
            build/ffmpeg/reports/darwin-arm64/
            build/desktop/reports/darwin-arm64/
          retention-days: 14
  verify:
    name: Verify darwin-arm64 on ${{ matrix.runner }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        runner:
          - macos-15
          - macos-26
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: 24.22.1
          architecture: arm64
      - name: Locate npm download cache
        id: npm-cache-directory
        run: node scripts/npm-cache-directory.mjs
      - name: Restore npm downloads
        id: npm-downloads
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.npm-cache-directory.outputs.directory }}
          key: npm-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
          restore-keys: npm-downloads-v1-${{ runner.os }}-
      - run: npm ci
      - name: Save completed npm downloads
        if: steps.npm-downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.npm-cache-directory.outputs.directory }}
          key: ${{ steps.npm-downloads.outputs.cache-primary-key }}
      - uses: actions/download-artifact@v7
        with:
          name: moartube-client-darwin-arm64-candidate
          path: build/desktop/releases/darwin-arm64/
      - run: npm run desktop:verify:darwin:arm64
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: moartube-client-darwin-arm64-${{ matrix.runner }}-verification
          path: build/desktop/reports/darwin-arm64/
          retention-days: 14
  upload-draft:
    name: Upload verified darwin-arm64 assets to draft
    needs:
      - build
      - verify
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: draft-upload-${{ github.repository }}-${{ inputs.release_tag }}-darwin-arm64
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: 24.22.1
      - uses: actions/download-artifact@v7
        with:
          name: moartube-client-darwin-arm64-candidate
          path: build/release-upload
      - name: Upload darwin-arm64 downloads to existing draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/upload-desktop-draft.mjs darwin-arm64 build/release-upload
