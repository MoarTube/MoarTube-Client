name: macOS Apple Silicon ARM64 FFmpeg candidate
on:
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  darwin:
    name: Build darwin-arm64
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: 24.22.1
          architecture: arm64
      - name: Restore verified FFmpeg downloads
        uses: actions/cache/restore@v5
        id: ffmpeg-downloads
        with:
          path: |
            build/ffmpeg/cache/sources
          key: ffmpeg-downloads-v1-${{ runner.os }}-${{ hashFiles('tooling/ffmpeg/sources.lock.json') }}
      - name: Identify compiled FFmpeg cache
        id: ffmpeg-key
        run: node tooling/ffmpeg/scripts/compiled-cache.mjs key darwin-arm64
      - name: Restore compiled FFmpeg candidate
        uses: actions/cache/restore@v5
        id: compiled-ffmpeg
        with:
          path: |-
            build/ffmpeg/install/darwin-arm64/bin
            build/ffmpeg/candidates/darwin-arm64
            build/ffmpeg/releases/darwin-arm64
            build/ffmpeg/state/darwin-arm64
            build/ffmpeg/reports/darwin-arm64/*.json
            build/ffmpeg/reports/darwin-arm64/software/result.json
          key: ${{ steps.ffmpeg-key.outputs.key }}
      - name: Verify restored FFmpeg candidate
        if: steps.compiled-ffmpeg.outputs.cache-hit == 'true'
        run: node tooling/ffmpeg/scripts/compiled-cache.mjs verify darwin-arm64
      - name: Download and verify all FFmpeg inputs
        if: steps.compiled-ffmpeg.outputs.cache-hit != 'true'
        run: node tooling/ffmpeg/scripts/download-inputs.mjs darwin-arm64
      - name: Check complete download cache
        if: ${{ !cancelled() && steps.ffmpeg-downloads.outputs.cache-hit != 'true' }}
        id: ffmpeg-cache-ready
        run: node tooling/ffmpeg/scripts/check-download-cache.mjs darwin
      - name: Save verified FFmpeg downloads
        if: ${{ !cancelled() && steps.ffmpeg-cache-ready.outputs.complete == 'true' }}
        uses: actions/cache/save@v5
        with:
          path: |
            build/ffmpeg/cache/sources
          key: ${{ steps.ffmpeg-downloads.outputs.cache-primary-key }}
      - name: Install compiler tools
        run: brew install cmake ninja meson nasm pkg-config xz
        if: steps.compiled-ffmpeg.outputs.cache-hit != 'true'
      - name: Verify tooling
        run: npm run ffmpeg:test:tooling
      - name: Build and verify locked Darwin sources
        run: npm run ffmpeg:build:darwin:arm64
        if: steps.compiled-ffmpeg.outputs.cache-hit != 'true'
      - name: Validate compiled candidate for caching
        id: compiled-cache-ready
        if: steps.compiled-ffmpeg.outputs.cache-hit != 'true'
        run: node tooling/ffmpeg/scripts/compiled-cache.mjs save darwin-arm64
      - name: Save verified compiled FFmpeg
        if: steps.compiled-cache-ready.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: |-
            build/ffmpeg/install/darwin-arm64/bin
            build/ffmpeg/candidates/darwin-arm64
            build/ffmpeg/releases/darwin-arm64
            build/ffmpeg/state/darwin-arm64
            build/ffmpeg/reports/darwin-arm64/*.json
            build/ffmpeg/reports/darwin-arm64/software/result.json
          key: ${{ steps.compiled-ffmpeg.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: ffmpeg-darwin-arm64-candidate
          path: |
            build/ffmpeg/releases/darwin-arm64/*/*.tar.xz
            build/ffmpeg/releases/darwin-arm64/*/SHA256SUMS.txt
            build/ffmpeg/reports/darwin-arm64/
          retention-days: 14
    env:
      MOARTUBE_FFMPEG_OFFLINE: '1'
      MOARTUBE_DEPENDENCIES_PREPARED: '1'
