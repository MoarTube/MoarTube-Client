name: Local Windows Client-Node and GPU integration
# Requires a self-hosted runner with MoarTube Node already running on localhost:9090.
# This workflow downloads test dependencies first; it does not provision the server.
on:
  workflow_dispatch:
    inputs:
      gpu_backend:
        description: Required GPU backend (all requires every detected adapter to work)
        type: choice
        required: true
        default: all
        options: [all, nvenc, amf, qsv]
permissions:
  contents: read
concurrency:
  group: moartube-local-integration
  cancel-in-progress: false
jobs:
  e2e:
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/build/test/cache/playwright
      MOARTUBE_INTEGRATION_GPU_BACKEND: ${{ inputs.gpu_backend }}
      MOARTUBE_E2E_USERNAME: ${{ secrets.MOARTUBE_E2E_USERNAME }}
      MOARTUBE_E2E_PASSWORD: ${{ secrets.MOARTUBE_E2E_PASSWORD }}
    runs-on:
      - self-hosted
      - Windows
      - X64
      - moartube-integration
    timeout-minutes: 120
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: 24.22.1
      - name: Locate npm download cache
        id: npm-cache-directory
        run: node scripts/npm-cache-directory.mjs
      - name: Restore npm downloads
        id: npm-downloads
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.npm-cache-directory.outputs.directory }}
          key: npm-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - run: npm.cmd ci
      - name: Save completed npm downloads
        if: steps.npm-downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.npm-cache-directory.outputs.directory }}
          key: ${{ steps.npm-downloads.outputs.cache-primary-key }}
      - name: Verify local Node, compiled FFmpeg and required physical GPUs
        run: npm.cmd run test:integration:preflight
      - name: Restore Playwright browser downloads
        id: playwright-downloads
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - run: npx.cmd playwright install chromium firefox webkit
      - name: Save completed Playwright browser downloads
        if: steps.playwright-downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: ${{ steps.playwright-downloads.outputs.cache-primary-key }}
      - name: Run all local checks, hardware pipelines and browser journeys
        run: npm.cmd run test:integration
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: local-windows-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
            build/integration/reports/
            temp/e2e-client.log
          retention-days: 14
