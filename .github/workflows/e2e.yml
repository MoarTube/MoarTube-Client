name: Real Client-Node Playwright integration
# Requires a self-hosted runner with MoarTube Node already running on localhost:9090.
# This workflow downloads test dependencies first; it does not provision the server.
on:
  workflow_dispatch: null
permissions:
  contents: read
concurrency:
  group: moartube-local-integration
  cancel-in-progress: false
jobs:
  e2e:
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/build/test/cache/playwright
    runs-on:
      - self-hosted
      - moartube-integration
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: 24.22.1
      - name: Locate npm download cache
        id: npm-cache-directory
        run: node scripts/npm-cache-directory.mjs
      - name: Restore npm downloads
        id: npm-downloads
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.npm-cache-directory.outputs.directory }}
          key: npm-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - name: Save completed npm downloads
        if: steps.npm-downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.npm-cache-directory.outputs.directory }}
          key: ${{ steps.npm-downloads.outputs.cache-primary-key }}
      - name: Restore Playwright browser downloads
        id: playwright-downloads
        uses: actions/cache/restore@v5
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - run: npx playwright install chromium firefox webkit
      - name: Save completed Playwright browser downloads
        if: steps.playwright-downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: ${{ steps.playwright-downloads.outputs.cache-primary-key }}
      - run: npm run typecheck
      - run: npm run typecheck:e2e
      - run: npm run lint:e2e
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e:all
        env:
          MOARTUBE_E2E_USERNAME: ${{ secrets.MOARTUBE_E2E_USERNAME }}
          MOARTUBE_E2E_PASSWORD: ${{ secrets.MOARTUBE_E2E_PASSWORD }}
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: playwright-real-node
          path: |
            playwright-report/
            test-results/
          retention-days: 14
