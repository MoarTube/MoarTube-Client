name: Windows desktop candidate
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Draft release tag
        type: string
        required: true
        default: ''
permissions:
  contents: read
env:
  MOARTUBE_RELEASE_TAG: ${{ inputs.release_tag }}
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 150
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_CACHE: ${{ github.workspace }}/build/desktop/cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/build/desktop/cache/builder
      MOARTUBE_FFMPEG_OFFLINE: '1'
      MOARTUBE_DEPENDENCIES_PREPARED: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: 24.22.1
      - name: Restore verified FFmpeg downloads
        uses: actions/cache/restore@v5
        id: ffmpeg-downloads
        with:
          path: |
            build/ffmpeg/cache/sources
            build/ffmpeg/cache/toolchains/win32-x64
          key: ffmpeg-downloads-v1-${{ runner.os }}-${{ hashFiles('tooling/ffmpeg/sources.lock.json', 'tooling/ffmpeg/toolchain.lock.json') }}
      - name: Identify compiled FFmpeg cache
        id: ffmpeg-key
        run: node tooling/ffmpeg/scripts/compiled-cache.mjs key win32-x64
      - name: Restore compiled FFmpeg candidate
        uses: actions/cache/restore@v5
        id: compiled-ffmpeg
        with:
          path: |-
            build/ffmpeg/install/win32-x64/bin
            build/ffmpeg/candidates/win32-x64
            build/ffmpeg/releases/win32-x64
            build/ffmpeg/state/win32-x64
            build/ffmpeg/reports/win32-x64/*.json
            build/ffmpeg/reports/win32-x64/software/result.json
          key: ${{ steps.ffmpeg-key.outputs.key }}
      - name: Verify restored FFmpeg candidate
        if: steps.compiled-ffmpeg.outputs.cache-hit == 'true'
        run: node tooling/ffmpeg/scripts/compiled-cache.mjs verify win32-x64
      - name: Restore desktop dependency downloads
        uses: actions/cache/restore@v5
        id: desktop-dependencies
        with:
          path: |-
            build/desktop/cache/electron
            build/desktop/cache/builder
          key: desktop-dependencies-v1-windows-x64-${{ hashFiles('package-lock.json', 'scripts/prefetch-desktop-tools.mjs', 'desktop/builder-cache.cjs', 'desktop/linux/dependencies.Dockerfile') }}
      - name: Locate npm download cache
        id: npm-cache-directory
        run: node scripts/npm-cache-directory.mjs
      - name: Restore npm downloads
        id: npm-downloads
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.npm-cache-directory.outputs.directory }}
          key: npm-downloads-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
      - name: Save completed npm downloads
        if: steps.npm-downloads.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.npm-cache-directory.outputs.directory }}
          key: ${{ steps.npm-downloads.outputs.cache-primary-key }}
      - name: Download Electron and packaging tools
        run: node scripts/prefetch-desktop-tools.mjs
      - name: Save desktop dependency downloads
        if: steps.desktop-dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |-
            build/desktop/cache/electron
            build/desktop/cache/builder
          key: ${{ steps.desktop-dependencies.outputs.cache-primary-key }}
      - name: Download and verify all FFmpeg inputs
        if: steps.compiled-ffmpeg.outputs.cache-hit != 'true'
        run: node tooling/ffmpeg/scripts/download-inputs.mjs win32-x64
      - name: Check complete download cache
        if: ${{ !cancelled() && steps.ffmpeg-downloads.outputs.cache-hit != 'true' }}
        id: ffmpeg-cache-ready
        run: node tooling/ffmpeg/scripts/check-download-cache.mjs windows
      - name: Save verified FFmpeg downloads
        if: ${{ !cancelled() && steps.ffmpeg-cache-ready.outputs.complete == 'true' }}
        uses: actions/cache/save@v5
        with:
          path: |
            build/ffmpeg/cache/sources
            build/ffmpeg/cache/toolchains/win32-x64
          key: ${{ steps.ffmpeg-downloads.outputs.cache-primary-key }}
      - name: Prepare locked Windows compiler before building
        if: steps.compiled-ffmpeg.outputs.cache-hit != 'true'
        run: npm run ffmpeg:build:windows -- --prepare-only
      - run: npm run ffmpeg:build:windows
        if: steps.compiled-ffmpeg.outputs.cache-hit != 'true'
      - name: Package verified FFmpeg for reuse
        if: steps.compiled-ffmpeg.outputs.cache-hit != 'true'
        run: npm run ffmpeg:package:windows
      - name: Validate compiled candidate for caching
        id: compiled-cache-ready
        if: steps.compiled-ffmpeg.outputs.cache-hit != 'true'
        run: node tooling/ffmpeg/scripts/compiled-cache.mjs save win32-x64
      - name: Save verified compiled FFmpeg
        if: steps.compiled-cache-ready.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: |-
            build/ffmpeg/install/win32-x64/bin
            build/ffmpeg/candidates/win32-x64
            build/ffmpeg/releases/win32-x64
            build/ffmpeg/state/win32-x64
            build/ffmpeg/reports/win32-x64/*.json
            build/ffmpeg/reports/win32-x64/software/result.json
          key: ${{ steps.compiled-ffmpeg.outputs.cache-primary-key }}
      - run: npm run typecheck
      - run: npm test
      - run: npm run desktop:test
      - run: npm run desktop:build:windows
      - name: Verify packaged Windows GUI
        run: npm run desktop:verify:windows -- "build/desktop/work/win32-x64/packages/win-unpacked/MoarTube Client.exe"
      - uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: moartube-client-windows-candidate
          path: |
            build/desktop/releases/win32-x64/*/*.exe
            build/desktop/releases/win32-x64/*/*.zip
            build/desktop/releases/win32-x64/*/*.blockmap
            build/desktop/releases/win32-x64/*/SHA256SUMS.txt
            build/desktop/releases/win32-x64/*/RELEASE-NOTES.md
          retention-days: 14
  upload-draft:
    name: Upload verified windows assets to draft
    needs: windows
    if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    concurrency:
      group: draft-upload-${{ github.repository }}-${{ inputs.release_tag }}-windows
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          package-manager-cache: false
          node-version: 24.22.1
      - uses: actions/download-artifact@v7
        with:
          name: moartube-client-windows-candidate
          path: build/release-upload
      - name: Upload win32-x64 downloads to existing draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/upload-desktop-draft.mjs win32-x64 build/release-upload
