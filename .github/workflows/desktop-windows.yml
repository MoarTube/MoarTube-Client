name: Windows desktop candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 150
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      ELECTRON_CACHE: ${{ github.workspace }}/build/desktop/cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/build/desktop/cache/builder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run ffmpeg:build:windows
      - run: npm run typecheck
      - run: npm test
      - run: npm run desktop:test
      - run: npm run desktop:dist:windows
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: moartube-client-windows-candidate
          path: |
            build/desktop/releases/win32-x64/*/*.exe
            build/desktop/releases/win32-x64/*/*.zip
            build/desktop/releases/win32-x64/*/*.blockmap
            build/desktop/releases/win32-x64/*/SHA256SUMS.txt
            build/desktop/releases/win32-x64/*/RELEASE-NOTES.md
          retention-days: 14
